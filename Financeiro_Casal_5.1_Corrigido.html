<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro Casal</title><style>body{margin:0;padding:15px;background:#0f172a;color:#fff;font-family:Segoe UI,sans-serif}.container{max-width:1200px;margin:auto}.card{background:#1e293b;border-radius:14px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.valor{font-size:30px;font-weight:700}input,select,button{padding:12px;border-radius:8px;border:1px solid #334155;margin:4px}button{background:#2563eb;color:#fff;border:none;cursor:pointer}.linha{background:#243447;padding:10px;border-radius:10px;margin-top:8px}.filtros{display:flex;flex-wrap:wrap;gap:8px}@media(max-width:768px){input,select,button{width:100%}.valor{font-size:24px}}</style></head><body><div class="container"><h1>💰 Financeiro Casal</h1><div class="card"><input id="data" type="date"><input id="desc" placeholder="Descrição"><input id="valor" type="number" step="0.01" placeholder="Valor"><select id="tipo"><option>Receita</option><option>Despesa</option></select><select id="categoria"><option>Salário</option><option>Hora Extra</option><option>Freelance</option><option>Investimentos</option><option>Alimentação</option><option>Mercado</option><option>Transporte</option><option>Combustível</option><option>Saúde</option><option>Lazer</option><option>Moradia</option><option>Pet</option><option>Assinaturas</option><option>Outros</option></select><select id="responsavel"><option>Kauan</option><option>Erica</option><option>Ambos</option></select><button id="btnSalvar">Salvar</button></div><div class="card filtros"><input id="pesquisa" placeholder="Pesquisar"><select id="fresp"><option value="">Todos</option><option>Kauan</option><option>Erica</option><option>Ambos</option></select></div><div class="grid"><div class="card">Receitas<div class="valor" id="r">R$ 0,00</div></div><div class="card">Despesas<div class="valor" id="d">R$ 0,00</div></div><div class="card">Saldo<div class="valor" id="s">R$ 0,00</div></div><div class="card">Lançamentos<div class="valor" id="q">0</div></div></div><div class="card"><div id="lista"></div></div></div><script>document.getElementById('data').value=new Date().toISOString().split('T')[0];let dados=[];try{dados=JSON.parse(localStorage.getItem('financeiroCasalV51')||'[]')}catch(e){dados=[]}let edit=-1;function salvarStorage(){localStorage.setItem('financeiroCasalV51',JSON.stringify(dados))}function render(){let rec=0,des=0,qtd=0,html='';const termo=(document.getElementById('pesquisa').value||'').toLowerCase();const filtro=document.getElementById('fresp').value;dados.forEach((x,i)=>{if(termo && !(x.desc+' '+x.categoria+' '+x.responsavel).toLowerCase().includes(termo)) return;if(filtro && x.responsavel!==filtro) return;qtd++;if(x.tipo==='Receita') rec+=x.valor; else des+=x.valor;html+=`<div class="linha"><b>${x.desc}</b><br>📅 ${x.data} | 👤 ${x.responsavel}<br>🏷️ ${x.categoria} | ${x.tipo}<br>R$ ${x.valor.toFixed(2)}<br><button onclick="editar(${i})">Editar</button> <button onclick="excluirLanc(${i})">Excluir</button></div>`});document.getElementById('lista').innerHTML=html;document.getElementById('r').innerText='R$ '+rec.toFixed(2);document.getElementById('d').innerText='R$ '+des.toFixed(2);document.getElementById('s').innerText='R$ '+(rec-des).toFixed(2);document.getElementById('q').innerText=qtd;}function editar(i){const x=dados[i];edit=i;data.value=x.data;desc.value=x.desc;valor.value=x.valor;tipo.value=x.tipo;categoria.value=x.categoria;responsavel.value=x.responsavel;}function excluirLanc(i){dados.splice(i,1);salvarStorage();render()}document.getElementById('btnSalvar').addEventListener('click',function(){const obj={data:data.value,desc:desc.value,valor:Number(valor.value||0),tipo:tipo.value,categoria:categoria.value,responsavel:responsavel.value};if(!obj.desc||obj.valor<=0){alert('Preencha descrição e valor');return;}if(edit>=0){dados[edit]=obj;edit=-1}else{dados.push(obj)}salvarStorage();render();desc.value='';valor.value='';});document.getElementById('pesquisa').addEventListener('input',render);document.getElementById('fresp').addEventListener('change',render);render();</script></body></html>
