<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financeiro Casal Online</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#0f172a;color:#fff;padding:20px}input,select,button{padding:10px;margin:4px;border-radius:8px}.card{background:#1e293b;padding:15px;border-radius:12px;margin-bottom:10px}.hidden{display:none}</style></head><body><h1>💰 Financeiro Casal Online</h1><div id="login" class="card"><h3>Login</h3><input id="email" placeholder="Email"><input id="senha" type="password" placeholder="Senha"><button onclick="entrar()">Entrar</button></div><div id="app" class="hidden"><div class="card"><button onclick="logout()">Sair</button><input id="data" type="date"><input id="descricao" placeholder="Descrição"><input id="valor" type="number"><select id="tipo"><option>Receita</option><option>Despesa</option></select><select id="categoria"><option>Salário</option><option>Alimentação</option><option>Transporte</option><option>Lazer</option><option>Outros</option></select><select id="responsavel"><option>Kauan</option><option>Erica</option><option>Ambos</option></select><button onclick="salvar()">Salvar</button></div><div id="lista"></div></div><script>const supabase=window.supabase.createClient('https://ucnsdwfcwklyyrihkdca.supabase.co','sb_publishable_XCB8Cgn5DyMw25vCvL03qA_5aOOCFRj');document.getElementById('data').value=new Date().toISOString().split('T')[0];async function entrar(){const {error}=await supabase.auth.signInWithPassword({email:email.value,password:senha.value});if(error){alert(error.message);return;}login.classList.add('hidden');app.classList.remove('hidden');carregar();}async function logout(){await supabase.auth.signOut();location.reload()}async function salvar(){const {error}=await supabase.from('lancamentos').insert([{data:data.value,descricao:descricao.value,categoria:categoria.value,tipo:tipo.value,responsavel:responsavel.value,valor:Number(valor.value)}]);if(error){alert(error.message);return;}carregar();}async function carregar(){const {data:rows}=await supabase.from('lancamentos').select('*').order('id',{ascending:false});lista.innerHTML='';(rows||[]).forEach(r=>{lista.innerHTML+=`<div class=card><b>${r.descricao}</b><br>${r.data} | ${r.responsavel}<br>R$ ${r.valor}</div>`})}supabase.auth.getSession().then(({data})=>{if(data.session){login.classList.add('hidden');app.classList.remove('hidden');carregar();}});</script></body></html>
